name: Construir APK (opcional)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Envolver la app con Capacitor
        run: |
          mkdir wrap && cd wrap
          npm init -y >/dev/null
          npm i @capacitor/core @capacitor/cli @capacitor/android >/dev/null
          npx cap init "Apuestas Tenis" com.msantos.apuestas --web-dir ../docs
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Apuestas Tenis (APK)
          files: wrap/android/app/build/outputs/apk/debug/app-debug.apk
