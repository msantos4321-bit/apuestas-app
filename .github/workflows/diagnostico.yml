name: Diagnostico
# Saca un resumen de la base CIFRADO (solo lo puede leer quien tiene la llave privada).
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: wnwecaapchcfhcljsvli
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar resultados (motor) y revisar TheOddsAPI
        run: |
          q='{"query":"select valor from ap_privado where clave = '"'"'cron'"'"'"}'
          C=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$q" | jq -r '.[0].valor')
          echo "::add-mask::$C"
          echo "== liquidar"
          curl -sS --max-time 140 -X POST "https://$REF.supabase.co/functions/v1/motor" -H "Content-Type: application/json" -H "x-ap-cron: $C" -d '{"accion":"liquidar"}'; echo
          echo "== scores Paris (TheOddsAPI)"
          curl -sS --max-time 60 -X POST "https://$REF.supabase.co/functions/v1/motor" -H "Content-Type: application/json" -H "x-ap-cron: $C" \
            -d '{"accion":"diag_scores","sport":"tennis_atp_paris_masters"}' | jq -r '"http \(.http) restantes \(.restantes)", (.muestra|tostring|.[0:2500])'
      - name: Consultar y cifrar
        run: |
          jq -Rs '{query: .}' diagnostico/consulta.sql > /tmp/q.json
          curl -sS --max-time 90 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /tmp/r.json
          echo "bytes: $(wc -c < /tmp/r.json)"
          gzip -9 -c /tmp/r.json > /tmp/r.gz
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/r.gz -out /tmp/r.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey diagnostico/llave_publica.pem -in /tmp/k.txt -out /tmp/k.enc
          echo "==LLAVE=="; base64 -w0 /tmp/k.enc; echo; echo "==DATOS=="; base64 -w0 /tmp/r.enc; echo; echo "==FIN=="
