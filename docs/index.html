<head>

<title>Apuestas Tenis</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1c1c1e; --muted:#6b7280; --line:#e6e8ee;
  --acc:#2563eb; --accsoft:#e8f0ff; --ok:#16a34a; --oksoft:#e7f6ec; --warn:#d97706; --warnsoft:#fff4e0;
  --bad:#dc2626; --badsoft:#fdecec; --r:18px; --sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(245,246,250,.92);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:21px;margin:0;letter-spacing:-.3px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accsoft);color:var(--acc)}
.chip.warn{background:var(--warnsoft);color:var(--warn)} .chip.ok{background:var(--oksoft);color:var(--ok)} .chip.bad{background:var(--badsoft);color:var(--bad)} .chip.gray{background:#eef0f4;color:var(--muted)}
main{padding:14px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.pos{color:var(--ok)} .neg{color:var(--bad)}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;font-weight:600;cursor:pointer;background:#eef0f4;color:var(--ink)}
button.pri{background:var(--acc);color:#fff} button.ok{background:var(--ok);color:#fff} button.bad{background:var(--bad);color:#fff}
button.ghost{background:transparent;color:var(--acc);padding:8px 10px} button.sm{padding:9px 12px;font-size:14px;border-radius:12px}
button:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .btns>button{flex:1;min-width:100px}
.pick{border-left:6px solid var(--ok)} .pick.amarillo{border-left-color:var(--warn)} .pick.rojo{border-left-color:var(--bad)}
.pick .who{font-size:19px;font-weight:700;letter-spacing:-.3px}
.callout{background:var(--accsoft);border-radius:14px;padding:12px 14px;margin:10px 0}
.callout b{font-size:22px;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px}
.stat .v{font-size:23px;font-weight:700;letter-spacing:-.4px} .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.seg{display:flex;background:#e9ebf1;border-radius:13px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:transparent;padding:9px 6px;font-size:13px;border-radius:10px;color:var(--muted)} .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right} td:first-child,th:first-child{text-align:left} th{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;background:#e9ebf1;border-radius:99px;overflow:hidden;margin:6px 0} .bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.bet{padding:12px 0;border-bottom:1px solid var(--line)} .bet:last-child{border-bottom:0}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:transparent;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round} nav button.on{color:var(--acc)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:20px}
.msg{padding:12px 14px;border-radius:14px;margin:10px 0;font-size:14px} .msg.ok{background:var(--oksoft);color:#166534} .msg.warn{background:var(--warnsoft);color:#92400e} .msg.bad{background:var(--badsoft);color:#991b1b} .msg.info{background:var(--accsoft);color:#1e40af}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-3px;margin-right:6px} @keyframes g{to{transform:rotate(360deg)}}
details{border-bottom:1px solid var(--line);padding:10px 0} summary{font-weight:600;cursor:pointer} details p{margin:8px 0 2px;color:#374151}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#111827;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:30;max-width:90%;box-shadow:var(--sh)}
</style>

<body>
<header><h1>Apuestas</h1><span id="estado" class="chip gray">...</span></header>
<main id="main"></main>
<nav id="nav"></nav>
<script src="config.js"></script>
<script>
"use strict";
/* ====================================================================
   APUESTAS TENIS  --  app instalable (PWA).  Un solo archivo.
   Guarda tus datos en TU Supabase; el motor de picks corre en la nube.
   ==================================================================== */
const CFG = window.APP_CONFIG || {};
const VERSION = CFG.VERSION || "1.0.0";
const TZ = "America/Tijuana";
const CONECTADA = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);

const S = {
  tab: "hoy", demo: !CONECTADA || localStorage.getItem("ap_demo") === "1",
  user: null, cfg: null, picks: [], apuestas: [], uso: null,
  filtro: null, cargando: false, offline: false, ultima: null, buscando: false, msg: null, authPaso: "correo", authCorreo: "",
};
let sb = null;

/* ---------------- utilidades ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (n < 0 ? "-" : "") + "$" + Math.abs(Number(n) || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const dia = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d);
function cuotaTxt(c) {
  c = Number(c); if (!c) return "-";
  if (S.cfg && S.cfg.formato_momio === "americano") return c >= 2 ? "+" + Math.round((c - 1) * 100) : String(Math.round(-100 / (c - 1)));
  return c.toFixed(2);
}
function cuando(iso) {
  const d = new Date(iso); const ms = d - Date.now();
  const hora = d.toLocaleString("es-MX", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  if (ms > 0 && ms < 36e5 * 30) { const h = ms / 36e5; return hora + " (" + (h < 1 ? "en " + Math.round(h * 60) + " min" : "en " + h.toFixed(1) + " h") + ")"; }
  return hora;
}
function toast(t) { const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2800); }
const sumar = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);

/* ---------------- demo ---------------- */
function datosDemo() {
  const h = (hrs) => new Date(Date.now() + hrs * 36e5).toISOString();
  const picks = [
    { id: 1, evento_id: "d1", jugador_a: "Jasmine Paolini", jugador_b: "Anhelina Kalinina", seleccion: "Jasmine Paolini", lado: "A", torneo: "WTA Ningbo", nivel: "WTA", superficie: "Hard", inicio: h(5), p_justa: 0.669, ref_fuente: "Pinnacle", cuota_min: 1.52, cuota_ref: 1.55, semaforo: "verde", estado: "activo", resultado: null },
    { id: 2, evento_id: "d2", jugador_a: "Marie Bouzkova", jugador_b: "Iga Swiatek", seleccion: "Iga Swiatek", lado: "B", torneo: "WTA Ningbo", nivel: "WTA", superficie: "Hard", inicio: h(27), p_justa: 0.749, ref_fuente: "consenso (22 casas)", cuota_min: 1.36, cuota_ref: 1.37, semaforo: "amarillo", estado: "activo", resultado: null },
    { id: 3, evento_id: "d3", jugador_a: "Tomas Machac", jugador_b: "Zangar Nurlanuly", seleccion: "Tomas Machac", lado: "A", torneo: "ATP Almaty", nivel: "ATP", superficie: "Hard", inicio: h(9), p_justa: 0.912, ref_fuente: "Pinnacle", cuota_min: 1.12, cuota_ref: 1.13, semaforo: "verde", estado: "activo", resultado: null },
  ];
  const ap = []; let id = 1; const base = Date.now();
  const add = (modo, est, sel, cuota, monto, res, dd, conf, nivel) => ap.push({ id: id++, pick_id: null, fecha: new Date(base - dd * 864e5).toISOString(), inicio: new Date(base - dd * 864e5).toISOString(), jugador_a: sel, jugador_b: "Rival", seleccion: sel, torneo: "WTA/ATP", nivel, estrategia: est, modo, cuota, monto, resultado: res, pnl: res === "W" ? +(monto * (cuota - 1)).toFixed(2) : res === "L" ? -monto : res === "X" ? 0 : null, confianza: conf, p_justa: 0.6 });
  const v3 = [["W", 1.48], ["L", 1.8], ["L", 2.4], ["W", 2.2], ["L", 3.1], ["L", 1.9], ["W", 1.6], ["L", 2.6], ["W", 1.75], ["L", 2.0], ["L", 3.3], ["W", 1.5]];
  v3.forEach((x, i) => add("historico", "v3", "Jugador v3-" + (i + 1), x[1], 12 + (i % 4) * 2, x[0], 40 - i * 2, ["ALTA", "MEDIA", "BAJA"][i % 3], i % 3 ? "ATP" : "WTA"));
  add("papel", "v4", "Iga Swiatek", 1.4, 20, "W", 6, "verde", "WTA"); add("papel", "v4", "Jannik Sinner", 1.25, 20, "W", 5, "verde", "ATP");
  add("papel", "v4", "Coco Gauff", 1.55, 18, "L", 4, "amarillo", "WTA");
  add("real", "v4", "Carlos Alcaraz", 1.3, 20, "W", 3, "verde", "ATP"); add("real", "v4", "Aryna Sabalenka", 1.45, 20, "W", 2, "verde", "WTA");
  add("real", "v4", "Daniil Medvedev", 1.52, 18, "L", 1, "verde", "ATP");
  ap.push({ id: id++, pick_id: 1, fecha: new Date().toISOString(), inicio: h(5), jugador_a: "Jasmine Paolini", jugador_b: "Anhelina Kalinina", seleccion: "Jasmine Paolini", torneo: "WTA Ningbo", nivel: "WTA", estrategia: "v4", modo: "real", cuota: 1.55, monto: 15, resultado: null, pnl: null, confianza: "verde", p_justa: 0.669 });
  const cfg = { id: 1, banca_inicial: 1000, tope_apuesta_pct: 2, tope_dia_pct: 5, kelly_fraccion: 0.25, p_min: 0.55, p_max: 0.92, ev_min: 0.02, cuota_max: 3, horas_max: 24, busquedas_max_dia: 3, formato_momio: "decimal" };
  return { cfg, picks, apuestas: ap.reverse(), uso: { dia: dia(), busquedas: 1, creditos_restantes: 438 } };
}

/* ---------------- conexion (Supabase) ---------------- */
function cargarLib() {
  return new Promise((res, rej) => {
    if (window.supabase) return res();
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar la libreria (revisa tu internet)")); document.head.appendChild(s);
  });
}
async function conectar() {
  await cargarLib();
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  sb.auth.onAuthStateChange(async (_e, ses) => { const antes = !!S.user; S.user = ses ? ses.user : null; if (S.user && !antes) { await cargar(); render(); } });
}
function conLimite(ms, f) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return f(c.signal).finally(() => clearTimeout(t)); }
function guardarCache() { try { localStorage.setItem("ap_cache", JSON.stringify({ t: Date.now(), cfg: S.cfg, picks: S.picks, apuestas: S.apuestas, uso: S.uso })); } catch (_) {} }
function leerCache() { try { const c = JSON.parse(localStorage.getItem("ap_cache") || "null"); if (c) { Object.assign(S, { cfg: c.cfg, picks: c.picks || [], apuestas: c.apuestas || [], uso: c.uso, ultima: c.t }); return true; } } catch (_) {} return false; }

async function cargar() {
  S.cargando = true; render();
  if (S.demo) { Object.assign(S, datosDemo(), { ultima: Date.now(), offline: false }); S.cargando = false; return; }
  try {
    const hace = new Date(Date.now() - 4 * 864e5).toISOString();
    const r = await conLimite(25000, (sig) => Promise.all([
      sb.from("ap_config").select("*").eq("id", 1).single().abortSignal(sig),
      sb.from("ap_picks").select("*").gte("inicio", hace).order("inicio").abortSignal(sig),
      sb.from("ap_apuestas").select("*").order("fecha", { ascending: false }).limit(1000).abortSignal(sig),
      sb.from("ap_uso").select("*").eq("dia", dia()).maybeSingle().abortSignal(sig),
    ]));
    for (const x of r) if (x.error) throw new Error(x.error.message);
    S.cfg = r[0].data; S.picks = r[1].data || []; S.apuestas = r[2].data || []; S.uso = r[3].data;
    S.offline = false; S.ultima = Date.now(); guardarCache();
  } catch (e) {
    S.offline = true;
    if (!S.cfg) leerCache();
    if (!S.cfg) S.cfg = datosDemo().cfg;
    S.msg = { t: "warn", m: "Sin conexion: mostrando lo ultimo guardado. (" + e.message + ")" };
  }
  S.cargando = false;
}

async function llamarMotor(accion) {
  const { data } = await sb.auth.getSession();
  const tok = data.session && data.session.access_token;
  if (!tok) throw new Error("Tu sesion caduco. Inicia sesion otra vez.");
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 55000);
  try {
    const r = await fetch(CFG.SUPABASE_URL + "/functions/v1/motor", { method: "POST", signal: c.signal, headers: { "Content-Type": "application/json", Authorization: "Bearer " + tok, apikey: CFG.SUPABASE_ANON_KEY }, body: JSON.stringify({ accion }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !j.mensaje) throw new Error("El motor respondio " + r.status + (r.status === 404 ? " (falta publicar la funcion 'motor')" : ""));
    return j;
  } catch (e) { if (e.name === "AbortError") throw new Error("El motor tardo demasiado. Intenta de nuevo en un minuto."); throw e; }
  finally { clearTimeout(t); }
}

/* ---------------- calculos ---------------- */
function bancaReal() { const c = S.cfg || {}; return (Number(c.banca_inicial) || 0) + sumar(S.apuestas.filter((a) => a.modo === "real"), (a) => a.pnl); }
function expuestoHoy() { const hoy = dia(); return sumar(S.apuestas.filter((a) => a.modo === "real" && dia(new Date(a.fecha)) === hoy), (a) => a.monto); }
function stakeSugerido(p, cuota) {
  const c = S.cfg, b = cuota - 1, q = 1 - p; if (b <= 0) return 0;
  const f = (b * p - q) / b; if (f <= 0) return 0;
  const banca = bancaReal();
  return Math.round(banca * Math.min(f * Number(c.kelly_fraccion), Number(c.tope_apuesta_pct) / 100) * 100) / 100;
}
function stats(lista) {
  const liq = lista.filter((a) => a.resultado === "W" || a.resultado === "L");
  const w = liq.filter((a) => a.resultado === "W").length, pnl = sumar(liq, (a) => a.pnl), inv = sumar(liq, (a) => a.monto);
  const orden = liq.slice().sort((a, b) => new Date(b.inicio || b.fecha) - new Date(a.inicio || a.fecha));
  let racha = 0, tipo = ""; for (const a of orden) { if (!tipo) tipo = a.resultado; if (a.resultado === tipo) racha++; else break; }
  return { n: liq.length, w, l: liq.length - w, acierto: liq.length ? w / liq.length : null, pnl, inv, yield: inv ? pnl / inv : null, racha, tipoRacha: tipo, pend: lista.filter((a) => !a.resultado).length };
}
function porClave(lista, clave) {
  const m = {}; for (const a of lista) { if (a.resultado !== "W" && a.resultado !== "L") continue; const k = a[clave] || "Sin dato"; (m[k] = m[k] || []).push(a); }
  return Object.entries(m).map(([k, v]) => ({ k, ...stats(v) })).sort((a, b) => b.n - a.n);
}

/* ---------------- "copiar para Claude" ---------------- */
function resumenClaude() {
  const L = ["# Segunda opinion de apuestas de tenis (" + new Date().toLocaleString("es-MX", { timeZone: TZ }) + ")", "",
    "Eres mi segundo par de ojos. La app mide precio contra un mercado afilado (Pinnacle/consenso); NO ve noticias. Revisa cada partido buscando en la web: lesiones, retiros recientes, fatiga, superficie/condiciones, motivacion. Dame APOSTAR o PASAR por partido con una razon corta. Se honesto: si no hay ventaja clara, PASAR. Mi casa es Caliente (solo apuesto si paga al menos la cuota minima).", ""];
  const real = stats(S.apuestas.filter((a) => a.modo === "real")), pap = stats(S.apuestas.filter((a) => a.modo === "papel"));
  L.push("## Mi marcador", "- Real: " + real.n + " liquidadas, P&L " + money(real.pnl) + (real.yield !== null ? ", yield " + pct(real.yield) : ""), "- Papel (v4): " + pap.n + " liquidadas, P&L " + money(pap.pnl), "");
  const ps = picksActivos(); L.push("## Picks de hoy");
  if (!ps.length) L.push("- Ninguno por ahora.");
  ps.forEach((p) => L.push("- " + p.seleccion + " (" + p.jugador_a + " vs " + p.jugador_b + ", " + p.torneo + ", " + p.superficie + ") | inicio " + cuando(p.inicio) + " | prob. justa " + pct(p.p_justa) + " (" + p.ref_fuente + ") | apostar solo si Caliente paga >= " + p.cuota_min.toFixed(2)));
  return L.join("\n");
}
async function copiar(texto, ok) { try { await navigator.clipboard.writeText(texto); toast(ok || "Copiado. Pegalo en Claude."); } catch (_) { const t = document.createElement("textarea"); t.value = texto; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); toast(ok || "Copiado."); } catch (e) { toast("No se pudo copiar"); } t.remove(); } }

/* ---------------- acciones ---------------- */
const picksActivos = () => S.picks.filter((p) => p.estado === "activo" && !p.resultado && new Date(p.inicio) > Date.now()).sort((a, b) => new Date(a.inicio) - new Date(b.inicio));
const apuestaDe = (p) => S.apuestas.find((a) => a.pick_id === p.id);

async function accionBuscar() {
  if (S.buscando) return;
  if (S.demo) { S.msg = { t: "info", m: "Demostracion: aqui el motor buscaria picks nuevos y liquidaria resultados." }; return render(); }
  S.buscando = true; S.msg = null; render();
  try {
    const r = await llamarMotor("buscar");
    if (!r.ok) S.msg = { t: r.error === "limite" ? "warn" : "bad", m: r.mensaje || "No se pudo buscar." };
    else S.msg = { t: "ok", m: "Listo: " + r.partidos + " partidos revisados en " + r.torneos + " torneos, " + r.picks + " picks con valor potencial" + (r.liquidados ? ", " + r.liquidados + " resultado(s) liquidado(s)" : "") + "." };
    await cargar();
  } catch (e) { S.msg = { t: "bad", m: e.message }; reportar("buscar", e); }
  S.buscando = false; render();
}
async function guardarApuesta(p, v) {
  const fila = { pick_id: p.id, evento_id: p.evento_id, jugador_a: p.jugador_a, jugador_b: p.jugador_b, seleccion: p.seleccion, torneo: p.torneo, nivel: p.nivel, estrategia: p.estrategia || "v4", modo: v.modo, cuota: v.cuota, monto: v.monto, p_justa: p.p_justa, confianza: p.semaforo, inicio: p.inicio, origen: "app" };
  if (S.demo) { S.apuestas.unshift({ ...fila, id: Date.now(), fecha: new Date().toISOString(), resultado: null, pnl: null }); return; }
  const { error } = await sb.from("ap_apuestas").insert(fila); if (error) throw new Error(error.message);
  await cargar();
}

function lineaPnl(lista) {
  const liq = lista.filter((a) => a.resultado === "W" || a.resultado === "L").sort((a, b) => new Date(a.inicio || a.fecha) - new Date(b.inicio || b.fecha));
  if (liq.length < 2) return "";
  let acc = 0; const pts = [0].concat(liq.map((a) => (acc += Number(a.pnl) || 0)));
  const W = 320, H = 110, mn = Math.min(...pts, 0), mx = Math.max(...pts, 0), rg = mx - mn || 1;
  const x = (i) => (i / (pts.length - 1)) * (W - 8) + 4, y = (v) => H - 8 - ((v - mn) / rg) * (H - 16);
  const d = pts.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const col = acc >= 0 ? "#16a34a" : "#dc2626";
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="100%" style="margin-top:10px"><line x1="0" x2="' + W + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="#d1d5db" stroke-dasharray="4 4"/><path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.5" stroke-linejoin="round"/></svg>';
}

}

function render() {
  const main = $("#main"), nav = $("#nav"), est = $("#estado");
  est.className = "chip " + (S.demo ? "warn" : S.offline ? "gray" : "ok");
  est.textContent = S.demo ? "Demostración" : S.offline ? "Sin conexión" : S.cargando ? "Actualizando..." : "En línea";
  if (!S.demo && !S.user) { nav.innerHTML = ""; main.innerHTML = vistaLogin(); return; }
  if (!S.cfg) { main.innerHTML = '<div class="empty"><span class="spin" style="border-color:#2563eb;border-top-color:transparent"></span> Cargando...</div>'; nav.innerHTML = ""; return; }
  const vistas = { hoy: vistaHoy, historial: vistaHistorial, banca: vistaBanca, estrategias: vistaEstrategias, ajustes: vistaAjustes };
  try { main.innerHTML = vistas[S.tab](); } catch (e) { main.innerHTML = '<div class="msg bad">Algo falló al mostrar esta pantalla. Ya se reportó. (' + esc(e.message) + ")</div>"; reportar("render " + S.tab, e); }
  nav.innerHTML = TABS.map(([k, t]) => '<button class="' + (S.tab === k ? "on" : "") + '" data-act="tab" data-k="' + k + '">' + ICON[k] + t + "</button>").join("");
}

/* ---------------- ventanas (modal) ---------------- */
function modal(html) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = '<div class="sheet">' + html + "</div>"; m.addEventListener("click", (e) => { if (e.target === m) m.remove(); }); document.body.appendChild(m); return m; }
function abrirApostar(p) {
  const sug = stakeSugerido(p.p_justa, p.cuota_min);
  const m = modal('<h3>Registrar apuesta</h3><div class="muted small">' + esc(p.seleccion) + " &middot; mínimo para valer: " + cuotaTxt(p.cuota_min) + '</div><label>Cuota que te paga Caliente (decimal)</label><input id="m_cuota" type="number" inputmode="decimal" step="0.01" value="' + p.cuota_min.toFixed(2) + '"><label>Monto apostado ($)</label><input id="m_monto" type="number" inputmode="decimal" step="0.5" value="' + (sug || "") + '"><label>Tipo</label><select id="m_modo"><option value="real">Real (dinero verdadero)</option><option value="papel">Papel (práctica)</option></select><div id="m_aviso"></div><div class="btns"><button class="ok" id="m_ok">Guardar</button><button id="m_no">Cancelar</button></div>');
  const aviso = () => {
    const cuota = parseFloat($("#m_cuota", m).value), monto = parseFloat($("#m_monto", m).value), banca = bancaReal(), c = S.cfg;
    let t = "";
    if (cuota > 1) { const ev = p.p_justa * cuota - 1; t += '<div class="msg ' + (ev >= Number(c.ev_min) ? "ok" : "bad") + '">' + (ev >= Number(c.ev_min) ? "Con esa cuota hay ventaja de " + pct(ev) + ". Vale la pena." : "Con esa cuota la ventaja es " + pct(ev) + ". No alcanza el mínimo: mejor pasar.") + "</div>"; }
    if (monto > 0) {
      if (monto > banca * Number(c.tope_apuesta_pct) / 100 + 0.001) t += '<div class="msg warn">Pasa tu tope por apuesta (' + money(banca * Number(c.tope_apuesta_pct) / 100) + ").</div>";
      if (expuestoHoy() + monto > banca * Number(c.tope_dia_pct) / 100 + 0.001) t += '<div class="msg warn">Con esto pasarías tu tope diario (' + money(banca * Number(c.tope_dia_pct) / 100) + ").</div>";
    }
    $("#m_aviso", m).innerHTML = t;
  };
  m.addEventListener("input", aviso); aviso();
  $("#m_no", m).onclick = () => m.remove();
  $("#m_ok", m).onclick = async () => {
    const cuota = parseFloat($("#m_cuota", m).value), monto = parseFloat($("#m_monto", m).value);
    if (!(cuota > 1) || !(monto > 0)) return toast("Escribe cuota y monto válidos");
    try { await guardarApuesta(p, { cuota, monto, modo: $("#m_modo", m).value }); m.remove(); toast("Apuesta registrada"); render(); } catch (e) { toast("No se pudo guardar: " + e.message); reportar("guardarApuesta", e); }
  };
}

/* ---------------- eventos ---------------- */
const num = (id) => parseFloat($(id).value);
document.addEventListener("click", async (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  try {
    if (act === "tab") { S.tab = b.dataset.k; S.msg = null; render(); window.scrollTo(0, 0); }
    else if (act === "buscar") await accionBuscar();
    else if (act === "apostar") abrirApostar(S.picks.find((p) => p.id == id));
    else if (act === "pasar") { await pasarPick(S.picks.find((p) => p.id == id)); render(); }
    else if (act === "copiar1") { const p = S.picks.find((x) => x.id == id); copiar(resumenClaude().split("## Picks de hoy")[0] + "## Partido a revisar\n- " + p.seleccion + " (" + p.jugador_a + " vs " + p.jugador_b + ", " + p.torneo + ") | prob. justa " + pct(p.p_justa) + " | apostar solo si Caliente paga >= " + p.cuota_min.toFixed(2)); }
    else if (act === "copiarTodo") copiar(resumenClaude());
    else if (act === "res") { await marcarResultado(id, b.dataset.r); render(); }
    else if (act === "borrar") { if (confirm("¿Eliminar esta apuesta?")) { await borrarApuesta(id); render(); } }
    else if (act === "filtro") { S.filtro = b.dataset.k; render(); }
    else if (act === "guardarBanca") { await guardarCfg({ banca_inicial: num("#c_banca"), tope_apuesta_pct: num("#c_tope"), tope_dia_pct: num("#c_dia"), kelly_fraccion: num("#c_kelly"), formato_momio: $("#c_fmt").value }); S.msg = { t: "ok", m: "Guardado." }; render(); }
    else if (act === "guardarEstrategia") { await guardarCfg({ p_min: num("#e_pmin"), ev_min: num("#e_ev"), cuota_max: num("#e_cmax"), horas_max: Math.round(num("#e_h")), busquedas_max_dia: Math.round(num("#e_bus")) }); S.msg = { t: "ok", m: "Reglas guardadas. Se usarán en la próxima búsqueda." }; render(); }
    else if (act === "recargar") { await cargar(); render(); toast("Actualizado"); }
    else if (act === "salir") { await sb.auth.signOut(); S.user = null; S.authPaso = "correo"; render(); }
    else if (act === "entrarDemo") { S.demo = true; localStorage.setItem("ap_demo", "1"); await cargar(); render(); }
    else if (act === "salirDemo") { S.demo = false; localStorage.removeItem("ap_demo"); S.cfg = null; await iniciar(); }
    else if (act === "instalar") { window.__instalar.prompt(); window.__instalar = null; }
    else if (act === "leer") { const u = new SpeechSynthesisUtterance(AYUDA.map(([q, a]) => q + " " + a).join(" ")); u.lang = "es-MX"; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    else if (act === "falla") { const t = prompt("¿Qué pasó?"); if (t) { ultimoReporte = 0; await reportar("manual", new Error(t)); toast("Gracias, quedó reportado"); } }
    else if (act === "enviarCodigo") {
      const mail = $("#a_mail").value.trim(); if (!mail.includes("@")) return toast("Escribe tu correo");
      S.authCorreo = mail; b.disabled = true;
      const { error } = await sb.auth.signInWithOtp({ email: mail, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      if (error) { S.msg = { t: "bad", m: error.message }; } else { S.msg = null; S.authPaso = "codigo"; }
      render();
    }
    else if (act === "verificarCodigo") {
      const { error } = await sb.auth.verifyOtp({ email: S.authCorreo, token: $("#a_cod").value.trim(), type: "email" });
      if (error) { S.msg = { t: "bad", m: "Código incorrecto o vencido." }; render(); }
    }
    else if (act === "otroCorreo") { S.authPaso = "correo"; render(); }
  } catch (e) { toast("Falló: " + e.message); reportar("click " + act, e); render(); }
});

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.__instalar = e; });
window.addEventListener("online", () => { if (!S.demo) cargar().then(render); });

/* ---------------- arranque ---------------- */
async function iniciar() {
  render();
  if (!S.demo) {
    try { await conectar(); } catch (e) { S.msg = { t: "bad", m: e.message }; if (leerCache()) { S.offline = true; } else { S.demo = false; render(); return; } }
    if (!S.user && !S.offline) return render();
  }
  await cargar();
  const h = location.hash.replace("#", ""); if (["hoy", "historial", "banca", "estrategias", "ajustes"].includes(h)) S.tab = h;
  render();
}
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
  let recargado = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (recargado || !navigator.serviceWorker.controller) return; });
}
iniciar();
</script>
</body>
